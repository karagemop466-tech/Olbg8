name: OLBG live harvest

# The agent sandbox cannot reach olbg.com, so the harvest runs on a GitHub
# runner and commits the decoded JSON back to the branch. Only captured data is
# written; nothing is synthesised here.

on:
  push:
    paths:
      - "scripts/collect_olbg.py"
      - ".github/workflows/olbg-collect.yml"
      - "collect/trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: olbg-harvest-v3-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Harvest OLBG hydration feeds
        run: |
          mkdir -p data/olbg
          set +e
          python3 scripts/collect_olbg.py --mode inventory >> /tmp/harvest.log 2>&1
          python3 scripts/collect_olbg.py --mode raw >> /tmp/harvest.log 2>&1
          code=$?
          printf 'exit=%s\n' "$code" > data/olbg/_last_run.txt
          tail -c 6000 /tmp/harvest.log >> data/olbg/_last_run.txt
          cat /tmp/harvest.log

      - name: Show harvest summary
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, pathlib
          probe = json.loads(pathlib.Path("data/olbg/_probe.json").read_text())
          for key, sport in probe["sports"].items():
              pages = ", ".join(f"{n}={p.get('status')}/{p.get('bytes')}B" for n, p in (sport.get("pages") or {}).items()) if isinstance(sport.get("pages"), dict) else ""
              print(f"{key:16s} rows={sport.get('rows')} events={sport.get('events')} {pages}")
          PY

      - name: Commit captured data
        if: always()
        run: |
          git config user.name "olbg-harvest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/olbg
          if git diff --cached --quiet; then
            echo "no changes captured"
            exit 0
          fi
          git commit -m "data: OLBG harvest $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            if git push origin "HEAD:${{ github.ref_name }}"; then echo pushed; break; fi
            sleep 10
          done
