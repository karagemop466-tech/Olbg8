name: Official source probe

# Runs on a GitHub runner because the agent sandbox only reaches GitHub/npm/PyPI.
# Commits the status + shape of every official endpoint so parsers are written
# against what actually answered, not against assumptions.

on:
  push:
    paths:
      - "scripts/collect_official.py"
      - ".github/workflows/official-collect.yml"
      - "collect/trigger-official.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-probe-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe official endpoints
        run: |
          mkdir -p data/official
          set +e
          python3 scripts/collect_official.py > /tmp/probe.log 2>&1
          code=$?
          printf 'exit=%s\n' "$code" > data/official/_last_run.txt
          tail -c 8000 /tmp/probe.log >> data/official/_last_run.txt
          cat /tmp/probe.log

      - name: Commit probe results
        run: |
          git config user.name "official-probe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/official
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: official source probe $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            if git push origin "HEAD:${{ github.ref_name }}"; then echo pushed; break; fi
            sleep 10
          done
