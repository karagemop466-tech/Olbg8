name: Collect OLBG 2026-10-27 snapshot

on:
  push:
    branches: [arena/3822f8fb-olbg8]
    paths:
      - data/capture-20261027/TRIGGER.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-20261027
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out session branch
        uses: actions/checkout@v4
        with:
          ref: arena/3822f8fb-olbg8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch OLBG data endpoints and official sources
        run: python3 scripts/collect_20261027.py 420

      - name: Commit snapshot to the session branch
        run: |
          git config user.name "olbg8-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data/capture-20261027
          if git diff --cached --quiet; then
            echo "no snapshot changes"
          else
            git commit -m "data: 2026-10-27 OLBG and official-source snapshot"
            git pull --rebase origin arena/3822f8fb-olbg8
            git push origin HEAD:arena/3822f8fb-olbg8
          fi
