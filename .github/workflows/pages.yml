name: Validate site before Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild and verify
        working-directory: pipeline
        run: |
          python3 parse_olbg.py
          python3 parse_events.py
          python3 extract_official.py
          python3 build.py
      - name: Regenerate site and check links
        run: |
          python3 pipeline/site.py
          python3 pipeline/check.py
      - name: Report
        run: echo "GitHub Pages publishes the repository root from main; this job gates the build."
