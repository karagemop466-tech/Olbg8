name: Gate Pages on a verified build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest discover -s pipeline/tests -v
      - name: Regenerate and verify the site
        run: |
          python3 pipeline/site.py
          python3 pipeline/check.py
      - name: Report
        run: echo "GitHub Pages publishes the repository root from main; this job gates the build."
