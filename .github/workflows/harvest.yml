name: OLBG live harvest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe or harvest"
        required: false
        default: "probe"
  push:
    branches: [arena/c2f58873-olbg8]
    paths:
      - 'pipeline/**'
      - '.github/workflows/harvest.yml'

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/c2f58873-olbg8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run collector
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          mode="$MODE"
          if [ -z "$mode" ]; then mode="$(cat pipeline/mode.txt)"; fi
          echo "mode=$mode"
          python3 pipeline/collect.py --mode "$mode" 2>&1 | tee pipeline/out/run.log
      - name: Commit harvested data
        run: |
          set -x
          git config user.name "olbg-harvest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A pipeline/raw pipeline/out pipeline/facts
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "harvest: live OLBG + official source capture [skip quality]"
          git pull --rebase=merges origin arena/c2f58873-olbg8 || true
          if ! git push origin HEAD:arena/c2f58873-olbg8 2>/tmp/pusherr; then
            msg=$(tr '\n' ' ' < /tmp/pusherr | cut -c1-900)
            echo "::error::push failed: $msg"
            exit 1
          fi
