name: olbg-collect

# Collects live OLBG market data from GitHub's runners (the agent sandbox is
# egress-restricted to GitHub/PyPI and cannot reach olbg.com) and commits the
# raw output back to the branch that triggered the run.

on:
  push:
    branches: [arena/**]
    paths:
      - "scripts/olbg_collect.py"
      - "scripts/olbg_parse.py"
      - ".github/workflows/scrape.yml"
  workflow_dispatch:
    inputs:
      max_event_pages:
        description: "Event pages fetched per sport"
        default: "30"

permissions:
  contents: write

concurrency:
  group: olbg-collect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install --quiet requests beautifulsoup4
      - name: Collect
        env:
          MAX_EVENT_PAGES: ${{ github.event.inputs.max_event_pages || '30' }}
        run: python scripts/olbg_collect.py
      - name: Commit collected data
        if: always()
        run: |
          git config user.name "olbg-collector"
          git config user.email "collector@users.noreply.github.com"
          git add -A data/olbg
          git diff --cached --quiet && echo "no changes" || {
            git commit -m "data: OLBG collection $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull --rebase -q origin ${GITHUB_REF#refs/heads/} && git push origin HEAD:${GITHUB_REF#refs/heads/} && break || sleep 5; done
          }
