name: Current public-source access probe
on:
  push:
    branches: [arena/6bb9f412-olbg8]
    paths: [current/probe.py, .github/workflows/current-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public-source access
        run: python current/probe.py
