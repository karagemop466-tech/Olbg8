name: Expanded public discovery artifact
on:
  push:
    branches: [arena/7fbe3ee0-olbg8]
    paths: ['.github/workflows/evidence-discovery.yml']
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: evidence-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m scripts.collect
      - run: python -m scripts.build && python -m scripts.check
      - uses: actions/upload-artifact@v4
        with:
          name: expanded-discovery-log-and-site
          path: |
            evidence-lab/data/collection-status.json
            evidence-lab/data/collection/
            evidence-lab/_site/
          retention-days: 7
