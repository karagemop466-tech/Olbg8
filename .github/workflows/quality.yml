name: Site quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild prices and picks from the captured data
        run: python3 scripts/build_dashboard.py
      - name: Validate picks, prose, prices and local links
        run: python3 scripts/test_site.py
      - name: Check JavaScript syntax
        run: node --check assets/app.js
      - name: Confirm the committed dashboard matches the capture
        run: git diff --exit-code -- data/dashboard.json
