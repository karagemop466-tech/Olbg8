name: Site quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --- primary 2026-10-27 desk (session 3822f8fb) -------------------------------
      - name: Rebuild desk dataset from committed capture
        run: python3 scripts/desk_data.py
      - name: Rebuild desk pages
        run: python3 scripts/render_desk.py
      - name: Gate the primary desk (rows, sources, prose, links, determinism)
        run: python3 scripts/verify_desk.py

      # --- retained line-desk payload from concurrent sessions -----------------------
      - name: Rebuild retained line-desk payload
        run: python3 scripts/build_dashboard.py
      - name: Gate retained line-desk payload and its links
        run: python3 scripts/test_line_desk.py

      - name: Check Python and JavaScript syntax
        run: |
          python3 -m py_compile scripts/*.py
          node --check assets/app.js
          node --check assets/desk.js
      - name: Confirm generated primary-site files are committed
        run: |
          # data/dashboard.json, data/sources.json and pricing.html are owned by
          # concurrent collectors/generators and can change while a PR is open;
          # they are rebuilt and gated above, but not byte-guarded here.
          set +e
          git diff --exit-code -- data/desk-20261027.json \
            index.html picks.html lines.html matches.html sources.html \
            methodology.html flagged.html sports \
            assets/desk.css assets/desk.js
          code=$?
          if [ "$code" -ne 0 ]; then
            { echo "generated files differ (exit $code)"; git status --short; git diff --name-only; } > /tmp/desk-diff.txt
            cat /tmp/desk-diff.txt
          fi
          exit "$code"
      - name: Upload generated-file diff diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desk-diff-diagnosis
          path: /tmp/desk-diff.txt
          if-no-files-found: ignore
