name: Site quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate the extra-sport picks
        run: python price-engine/add_picks.py
      - name: Rebuild the picks desk
        run: python scripts/build_site.py
      - name: Gate the picks desk (word counts, window, bands, sources, links)
        run: python scripts/check_site.py
      - name: Check Python and JavaScript syntax
        run: |
          python -m py_compile price-engine/*.py scripts/*.py
          node --check assets/app.js
      - name: Confirm generated files are committed
        run: |
          git diff --exit-code -- data/desk-picks.json index.html picks.html matches.html \
            flagged.html sports/handball.html sports/rugby-union.html sports/tennis.html
