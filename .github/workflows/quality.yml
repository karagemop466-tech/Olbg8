name: Site quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest discover -s pipeline/tests -v
      - name: Regenerate the site from the committed payload
        run: python3 pipeline/site.py
      - name: Line-by-line payload and link checks
        run: python3 pipeline/check.py
      - name: Check JavaScript syntax
        run: node --check assets/app.js
