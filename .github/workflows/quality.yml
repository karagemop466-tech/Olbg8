name: Site quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild the desk from the committed capture
        working-directory: pipeline
        run: |
          python3 parse_olbg.py
          python3 parse_events.py
          python3 extract_official.py
          python3 build.py
      - name: Regenerate the site
        run: python3 pipeline/site.py
      - name: Unit tests
        run: python3 -m unittest discover -s pipeline/tests -v
      - name: Line-by-line payload and link checks
        working-directory: pipeline
        run: python3 check.py
      - name: Check JavaScript syntax
        run: node --check assets/app.js
