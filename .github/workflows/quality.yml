name: Site quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Price every captured market
        run: python3 scripts/originate.py
      - name: Rebuild the static site
        run: python3 scripts/build_site.py
      - name: Audit pages, links, prices and predictions
        run: python3 scripts/test_site.py
      - name: Compile Python sources
        run: python3 -m py_compile scripts/*.py
      - name: Check JavaScript syntax
        run: node --check assets/app.js
      - name: Confirm generated files are committed
        run: git diff --exit-code -- data/matches.json index.html picks.html matches.html pricing.html methodology.html sources.html flagged.html sports assets
