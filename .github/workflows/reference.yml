name: reference-data

# Pulls verified reference data (official records/standings/rankings/fixtures)
# from a runner with open egress and commits it for the pricing + writing steps.
on:
  push:
    branches: [arena/**]
    paths: ["scripts/fetch_reference.py", ".github/workflows/reference.yml"]
  workflow_dispatch:
    inputs:
      season:
        description: "Season year"
        default: "2026"

permissions:
  contents: write

concurrency:
  group: reference-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install --quiet requests beautifulsoup4
      - name: Fetch reference data
        env:
          SEASON: ${{ github.event.inputs.season || '2026' }}
        run: python scripts/fetch_reference.py || true
      - name: Commit
        if: always()
        run: |
          git config user.name "olbg-collector"
          git config user.email "collector@users.noreply.github.com"
          git add -A data/reference
          git diff --cached --quiet && echo "no changes" || {
            git commit -m "data: reference data $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull --rebase -q origin ${GITHUB_REF#refs/heads/} && git push origin HEAD:${GITHUB_REF#refs/heads/} && break || sleep 5; done
          }
