name: Daily unverified source discovery
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/discover.py
        working-directory: research-desk
      - uses: actions/upload-artifact@v4
        with:
          name: unverified-discovery
          path: research-desk/discovery-report.json
          retention-days: 14
