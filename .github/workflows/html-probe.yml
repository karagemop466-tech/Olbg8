name: html-probe
on:
  push:
    branches: [arena/**]
    paths: ["scripts/olbg_probe_html.py", ".github/workflows/html-probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install --quiet requests beautifulsoup4
      - run: python scripts/olbg_probe_html.py || true
      - name: Commit
        if: always()
        run: |
          git config user.name "olbg-collector"
          git config user.email "collector@users.noreply.github.com"
          git add -A data/olbg/html
          git diff --cached --quiet && echo "no changes" || {
            git commit -m "data: OLBG html probe $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:${GITHUB_REF#refs/heads/}
          }
